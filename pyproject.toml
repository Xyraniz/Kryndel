[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kryndel"
version = "0.1.0"
description = "A strongly typed language and portable desktop toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Xyraniz" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]


[project.scripts]
kryndel = "kryndel.cli:main"
kry = "kryndel.cli:main"

[tool.setuptools]
packages = ["kryndel"]
