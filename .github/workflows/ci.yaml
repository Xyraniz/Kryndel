name: Kryndel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go toolchain and native tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      - name: Run complete verification matrix
        run: make verify
        timeout-minutes: 45

  bootstrap:
    name: Locked Linux amd64 self-host bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and bootstrap revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up locked Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Rebuild and verify bootstrap stages
        env:
          KRY_REQUIRE_LOCKED_BOOTSTRAP: '1'
          KRY_STAGE36_WINDOWS_PE_OUTPUT: ${{ runner.temp }}/stage36-selfhost.exe
        run: bash scripts/bootstrap-stage3.sh
        timeout-minutes: 30
      - name: Upload Stage 2 Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: stage36-selfhost-windows-amd64
          path: ${{ runner.temp }}/stage36-selfhost.exe
          if-no-files-found: error

  windows:
    name: Windows amd64 native Go tests
    runs-on: windows-latest
    needs: bootstrap
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Run tests on Windows
        env:
          CGO_ENABLED: '0'
        run: go test ./...
        timeout-minutes: 30
      - name: Download Stage 2 Windows executable
        uses: actions/download-artifact@v4
        with:
          name: stage36-selfhost-windows-amd64
          path: stage36-pe
      - name: Execute Stage 2 generated Windows executable
        shell: pwsh
        run: |
          $output = & .\stage36-pe\stage36-selfhost.exe
          if ($LASTEXITCODE -ne 0) { throw "Stage 2 PE exited with $LASTEXITCODE" }
          if (($output -join "`n") -ne "Mode::Ready`n42") { throw "Unexpected Stage 2 PE output: $output" }

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Run concurrency tests under race detector
        run: make test-race

  portability:
    name: Cross-platform compile matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Cross-compile without CGO
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o build/kry-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/kry

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject removed implementation and generated artifacts
        run: |
          test ! -d native
          test ! -d kryndel
          test ! -e build/kry
          test ! -e dist/SHA256SUMS
