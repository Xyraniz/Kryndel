name: Kryndel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native language toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and check examples
        run: make check
      - name: Run integration suite
        run: PATH="/usr/bin:/bin" HOME= LC_ALL=C make test
      - name: Reject removed bootstrap artifacts
        run: |
          test ! -d kryndel
          test -z "$(find . -type f -name '*.py' -not -path './.git/*' -print)"
