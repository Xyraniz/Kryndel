name: Kryndel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go toolchain and native tests
    runs-on: ubuntu-latest
    env:
      KRY_SKIP_STAGE36_BOOTSTRAP: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      - name: Run complete verification matrix
        run: make verify
        timeout-minutes: 240

  bootstrap:
    name: Locked Linux amd64 self-host bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and bootstrap revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up locked Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Rebuild stages from the checked-in Kryndel seed without Go
        env:
          PATH: /usr/bin:/bin
          KRY_STAGE36_WINDOWS_PE_OUTPUT: ${{ runner.temp }}/stage36-selfhost.exe
          KRY_STAGE38_SELFHOST_PE_OUTPUT: ${{ runner.temp }}/stage38-selfhost.exe
          KRY_FIBONACCI_SELFHOST_PE_OUTPUT: ${{ runner.temp }}/fibonacci-selfhost.exe
          KRY_STAGE39_FFI_PE_OUTPUT: ${{ runner.temp }}/stage39-ffi-selfhost.exe
        run: bash scripts/bootstrap-stage3.sh
        timeout-minutes: 30
      - name: Verify Stage 0 reproduces the checked-in seed
        env:
          KRY_REQUIRE_LOCKED_BOOTSTRAP: '1'
          KRY_STAGE36_WINDOWS_PE_OUTPUT: ${{ runner.temp }}/stage36-selfhost.exe
        run: go test ./internal/kry -run '^TestStage36KryndelSecondCompilerBootstrap$' -count=1 -timeout=90m -v
        timeout-minutes: 105
      - name: Upload self-hosted Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-windows-amd64
          path: |
            ${{ runner.temp }}/stage36-selfhost.exe
            ${{ runner.temp }}/stage38-selfhost.exe
            ${{ runner.temp }}/fibonacci-selfhost.exe
            ${{ runner.temp }}/stage39-ffi-selfhost.exe
          if-no-files-found: error

  windows:
    name: Windows amd64 native Go tests
    runs-on: windows-latest
    needs: bootstrap
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Download self-hosted Windows executables
        uses: actions/download-artifact@v4
        with:
          name: selfhost-windows-amd64
          path: stage36-pe
      - name: Run tests on Windows
        env:
          CGO_ENABLED: '0'
          KRY_STAGE36_WINDOWS_PE_INPUT: ${{ github.workspace }}/stage36-pe/stage36-selfhost.exe
          KRY_STAGE39_FFI_PE_INPUT: ${{ github.workspace }}/stage36-pe/stage39-ffi-selfhost.exe
        run: go test ./...
        timeout-minutes: 30
      - name: Execute Stage 1 and self-hosted Fibonacci Windows executables
        shell: pwsh
        run: |
          $output = & .\stage36-pe\stage38-selfhost.exe
          if ($LASTEXITCODE -ne 0) { throw "Stage 1 PE exited with $LASTEXITCODE" }
          if (($output -join "`n") -ne "red`nyellow`ngreen`nwildcard") { throw "Unexpected Stage 1 PE output: $output" }
          $output = & .\stage36-pe\fibonacci-selfhost.exe
          if ($LASTEXITCODE -ne 0) { throw "Self-hosted Fibonacci PE exited with $LASTEXITCODE" }
          if (($output -join "`n") -ne "55") { throw "Unexpected self-hosted Fibonacci output: $output" }

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Run concurrency tests under race detector
        run: make test-race

  portability:
    name: Cross-platform compile matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Cross-compile without CGO
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o build/kry-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/kry

  native-hosts:
    name: Native host tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Run Go, native AOT, LSP, debugger, formatter, and package tests
        run: go test ./...
        timeout-minutes: 30

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject removed implementation and generated artifacts
        run: |
          test ! -d native
          test ! -d kryndel
          test ! -e build/kry
          test ! -e dist/SHA256SUMS
