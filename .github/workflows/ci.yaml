name: Kryndel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go toolchain and native tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Run complete verification matrix
        run: make verify
        timeout-minutes: 45

  bootstrap:
    name: Locked Linux amd64 self-host bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and bootstrap revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up locked Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Rebuild and verify bootstrap stages
        env:
          KRY_REQUIRE_LOCKED_BOOTSTRAP: '1'
        run: bash scripts/bootstrap-stage3.sh
        timeout-minutes: 30

  windows:
    name: Windows amd64 native Go tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Run tests on Windows
        env:
          CGO_ENABLED: '0'
        run: go test ./...
        timeout-minutes: 30

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Run concurrency tests under race detector
        run: make test-race

  portability:
    name: Cross-platform compile matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Cross-compile without CGO
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o build/kry-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/kry

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject removed implementation and generated artifacts
        run: |
          test ! -d native
          test ! -d kryndel
          test ! -e build/kry
          test ! -e dist/SHA256SUMS
