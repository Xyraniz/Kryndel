name: Kryndel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go toolchain and native tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build and run integration tests
        run: make test
      - name: Run static checks
        run: make test-static
      - name: Run bounded fuzz smoke checks
        run: make fuzz-smoke
      - name: Generate coverage report
        run: make coverage
      - name: Audit documentation
        run: make check-docs

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Run concurrency tests under race detector
        run: make test-race

  portability:
    name: Cross-platform compile matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Cross-compile without CGO
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o build/kry-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/kry

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject removed implementation and generated artifacts
        run: |
          test ! -d native
          test ! -d kryndel
          test ! -e build/kry
          test ! -e dist/SHA256SUMS
