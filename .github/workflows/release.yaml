name: Kryndel Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  native-release:
    name: Build native release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and verify
        run: |
          make clean
          make test
          make test-static
      - name: Package native executable
        shell: bash
        run: |
          mkdir -p dist
          cp build/kry "dist/kry-${{ matrix.os }}"
          tar -C dist -czf "kry-${{ matrix.os }}.tar.gz" "kry-${{ matrix.os }}"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "kry-${{ matrix.os }}.tar.gz"; else shasum -a 256 "kry-${{ matrix.os }}.tar.gz"; fi > "kry-${{ matrix.os }}.tar.gz.sha256"
          printf '{"SPDXID":"SPDXRef-DOCUMENT","spdxVersion":"SPDX-2.3","name":"Kryndel native release","documentNamespace":"https://github.com/Xyraniz/Kryndel/releases/${GITHUB_REF_NAME}","packages":[{"SPDXID":"SPDXRef-Package-Kryndel","name":"Kryndel","versionInfo":"%s","downloadLocation":"NOASSERTION"}]}' "${GITHUB_REF_NAME#v}" > "kry-${{ matrix.os }}.spdx.json"
          printf 'repository=%s\nref=%s\ncommit=%s\nplatform=${{ matrix.os }}\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" > "kry-${{ matrix.os }}.provenance.txt"
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: kry-${{ matrix.os }}
          path: kry-${{ matrix.os }}.*

  publish:
    name: Publish release assets
    needs: native-release
    runs-on: ubuntu-latest
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kry-*.tar.gz dist/kry-*.sha256 dist/*.spdx.json dist/*.provenance.txt
