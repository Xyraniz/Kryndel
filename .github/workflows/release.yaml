name: Kryndel Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.22.x'

jobs:
  verify:
    name: Verify Go toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run release gate
        run: |
          make clean
          make test
          make test-static
          make test-race
          make coverage

  release:
    name: Build release (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build self-contained binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          suffix=
          test "${{ matrix.goos }}" = windows && suffix=.exe
          go build -trimpath -ldflags='-s -w' -o "dist/kry-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}" ./cmd/kry
      - name: Generate checksums, SBOM, and provenance
        shell: bash
        run: |
          cd dist
          sha256sum kry-* > SHA256SUMS
          printf '{"SPDXID":"SPDXRef-DOCUMENT","spdxVersion":"SPDX-2.3","name":"Kryndel Go release","documentNamespace":"https://github.com/Xyraniz/Kryndel/releases/${GITHUB_REF_NAME}","packages":[{"SPDXID":"SPDXRef-Package-Kryndel","name":"Kryndel","versionInfo":"%s","downloadLocation":"NOASSERTION","licenseConcluded":"NOASSERTION"}]}' "${GITHUB_REF_NAME#v}" > "kry-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json"
          printf 'repository=%s\nref=%s\ncommit=%s\ntarget=${{ matrix.goos }}/${{ matrix.goarch }}\ncompiler=go-${GO_VERSION}\ncgo=disabled\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" > "kry-${{ matrix.goos }}-${{ matrix.goarch }}.provenance.txt"
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: kry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: Publish release assets
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
