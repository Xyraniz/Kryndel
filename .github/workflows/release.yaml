name: Kryndel Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'

jobs:
  verify:
    name: Verify Go toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run release gate
        run: |
          make clean
          make test
          make test-static
          make test-race
          make coverage

  bootstrap:
    name: Verify locked self-host bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and bootstrap revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up locked Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Rebuild and verify bootstrap stages
        env:
          KRY_REQUIRE_LOCKED_BOOTSTRAP: '1'
        run: bash scripts/bootstrap-stage3.sh
        timeout-minutes: 30

  release:
    name: Build release (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [verify, bootstrap]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build self-contained binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          suffix=
          test "${{ matrix.goos }}" = windows && suffix=.exe
          go build -trimpath -ldflags='-s -w' -o "dist/kry-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}" ./cmd/kry
      - name: Build Windows installer
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o dist/kry-installer-windows-amd64.exe ./cmd/kry-installer
      - name: Generate SPDX SBOM from release binaries
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: ${{ runner.temp }}/kry-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false
      - name: Validate release SBOM and generate checksums and provenance
        shell: bash
        run: |
          sbom="$RUNNER_TEMP/kry-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json"
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.packages | type == "array") and
            ([.packages[]?.externalRefs[]?.referenceLocator | select(type == "string" and startswith("pkg:golang/"))] | length >= 2)
          ' "$sbom" > /dev/null
          cp "$sbom" "dist/kry-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json"
          compiler="$(go version | awk '{print $3}')"
          printf 'repository=%s\nref=%s\ncommit=%s\ntarget=${{ matrix.goos }}/${{ matrix.goarch }}\ncompiler=%s\ncgo=disabled\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$compiler" > "dist/kry-${{ matrix.goos }}-${{ matrix.goarch }}.provenance.txt"
          cd dist
          sha256sum kry-* > SHA256SUMS
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: kry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: Publish release assets
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
